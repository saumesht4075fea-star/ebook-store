<!DOCTYPE html>
<html>
<head>
  <title>My eBook Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 32px;
    }

    .hero button {
      padding: 12px 20px;
      border: none;
      background: #111;
      color: white;
      margin-top: 15px;
      cursor: pointer;
      border-radius: 5px;
    }

    .section-title {
      text-align: center;
      margin: 30px 0 10px;
      font-size: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 5px;
    }

    .price {
      color: green;
      font-size: 18px;
      margin: 10px 0;
    }

    .card button {
      background: #4facfe;
      border: none;
      padding: 10px;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h2>📚 My eBook Store</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">Store</a>
    <a href="#">Contact</a>
  </nav>
</header>

<div class="hero">
  <h1>Earn Money & Learn Skills with eBooks</h1>
  <p>Instant download after purchase</p>
  <button onclick="alert('Scroll down to buy')">Browse eBooks</button>
</div>

<h2 class="section-title">🔥 Best Selling eBooks</h2>

<section class="products">

  <div class="card">
    <img src="https://via.placeholder.com/200x180">
    <h3>Money Making Guide</h3>
    <p class="price">₹99</p>
    <button onclick="window.location.href='YOUR_LINK_HERE'">Buy Now</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200x180">
    <h3>Instagram Growth Secrets</h3>
    <p class="price">₹149</p>
    <button onclick="window.location.href='YOUR_LINK_HERE'">Buy Now</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200x180">
    <h3>Fitness & Mindset</h3>
    <p class="price">₹79</p>
    <button onclick="window.location.href='YOUR_LINK_HERE'">Buy Now</button>
  </div>

</section>

<footer>
  <p>© 2026 My eBook Store | All Rights Reserved</p>
</footer>

</body>
</html>
